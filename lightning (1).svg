<svg width="800" height="160" viewBox="0 0 800 160" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#00D9FF"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="800" height="160" fill="url(#bg)"/>

  <!-- screen flash overlay, syncs with strikes -->
  <rect width="800" height="160" fill="#BFE9FF">
    <animate attributeName="opacity"
      values="0;0;0.35;0.05;0.3;0;0;0;0;0.28;0.03;0;0;0"
      keyTimes="0;0.10;0.115;0.13;0.145;0.18;0.5;0.60;0.615;0.63;0.645;0.68;0.9;1"
      dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- bolt 1 (left) -->
  <g filter="url(#glow)">
    <path d="M 90 10 L 55 78 L 82 78 L 62 150 L 120 65 L 90 65 Z"
          fill="url(#boltGrad)" pathLength="100"
          stroke="#FFFFFF" stroke-width="1">
      <animate attributeName="stroke-dashoffset" values="100;100;0;0;0;100" keyTimes="0;0.10;0.115;0.16;0.18;0.2" dur="6s" repeatCount="indefinite" attributeType="XML"/>
      <animate attributeName="stroke-dasharray" values="100" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity"
        values="0;0;1;0.5;1;0.2;0;0"
        keyTimes="0;0.10;0.113;0.13;0.145;0.16;0.18;1"
        dur="6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- bolt 2 (right) -->
  <g filter="url(#glow)">
    <path d="M 740 10 L 705 78 L 730 78 L 712 150 L 768 62 L 738 62 Z"
          fill="url(#boltGrad)" stroke="#FFFFFF" stroke-width="1">
      <animate attributeName="opacity"
        values="0;0;1;0.4;1;0.2;0;0"
        keyTimes="0;0.60;0.613;0.63;0.645;0.66;0.68;1"
        dur="6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- faint background sparks -->
  <g filter="url(#glow)">
    <path d="M 400 5 L 380 45 L 396 45 L 384 90 L 420 38 L 402 38 Z"
          fill="#7B2FFF" opacity="0">
      <animate attributeName="opacity"
        values="0;0;0.8;0.1;0.6;0;0"
        keyTimes="0;0.34;0.35;0.365;0.38;0.4;1"
        dur="6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- title text with flicker glow -->
  <g filter="url(#glow)">
    <text x="150" y="70" font-family="Courier New, monospace" font-size="34" font-weight="bold" fill="#E2E8F0">gyxnova</text>
    <text x="150" y="70" font-family="Courier New, monospace" font-size="34" font-weight="bold" fill="#00D9FF" opacity="0">
      <animate attributeName="opacity" values="0;0;0.9;0.3;0.9;0;0;0;0;0.9;0.2;0;0" keyTimes="0;0.10;0.115;0.13;0.145;0.18;0.5;0.60;0.615;0.63;0.645;0.68;1" dur="6s" repeatCount="indefinite"/>
    </text>
  </g>
  <text x="150" y="100" font-family="Courier New, monospace" font-size="16" fill="#A78BFA">⚡ AI/ML Engineer — Godspeed in code</text>
</svg>
